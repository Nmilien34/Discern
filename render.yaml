# ⚠ THIS FILE IS DOCUMENTATION, NOT AN INSTRUMENT. NOTHING HERE IS APPLIED.
#
# Established 2026-09-07 by auditing what actually reaches the running
# processes. Fourteen of the twenty-six variables declared below are present in
# production, and EVERY ONE OF THEM ARRIVES FROM THE RENDER DASHBOARD OR FROM
# THE PLATFORM. Not one arrives because this file says so.
#
# The Blueprint has never been applied. The evidence, if you want to re-check
# it: `NODE_ENV: production` is declared twice below and the API logs
# `nodeEnv: "development"` at startup; the six ELEVENLABS_* identity values are
# declared below and all six are running on the code's defaults.
#
# SO DO NOT REASON FROM THIS FILE ABOUT WHAT IS SET. We did exactly that about
# APPLE_BUNDLE_ID — read `sync: false` as "deliberately dashboard-managed" when
# it was simply unset, and the line declaring it was doing nothing at all. Check
# the dashboard, or check behaviour.
#
# `sync: false` in particular means nothing today. It is an instruction to a
# Blueprint sync that has never run.
#
# APPLYING IT PROPERLY IS ITS OWN DECISION, and a large one: a sync writes every
# value here at once and removes anything dashboard-set that this file does not
# declare — which today includes SERVICE_NAME (absent here, and without it the
# logs lose their name and report the URL slug instead) and TEST_CLIENT_ENABLED.
# Add SERVICE_NAME first, decide about the test client, then sync.
#
# ─────────────────────────────────────────────────────────────────────────────
#
# Two services from one repo: the API and the background worker.
#
# They build from the same commit but deploy INDEPENDENTLY. Corner's two drifted
# on 2026-08-28 — the worker ran current code while the web service served a
# build two commits earlier, returning 501 from handlers that had already been
# implemented. /healthz reports the running commit and service name so that state
# is one curl away rather than a diagnosis (see lib/build-info.ts); the worker
# logs the same shape at startup so the two can be compared directly.

# THE discern-secrets ENVIRONMENT GROUP IS AUTHORITATIVE.
#
# Both services pull every shared secret from it via `fromGroup`, and there are
# deliberately NO per-service duplicates, so there is exactly one place a value
# can be set. Do not re-add a key here that the group already defines: a
# per-service entry OVERRIDES the group, which reintroduces the silent drift the
# group exists to prevent — and the API and the worker must agree on the
# database, the bucket and the provider keys or the worker processes jobs
# against different infrastructure than the API wrote them to. A worker pointed
# at a different database is a genuinely nasty failure: the queue looks empty
# and jobs never run.
#
# Non-secret, per-service values (NODE_ENV, LOG_LEVEL, pool size, worker tuning)
# stay inline deliberately: they legitimately differ per service.
#
# `sync: false` means "this value is deliberately NOT in the repo — a human sets
# it in the Render dashboard". Render never invents a value for it, and a service
# that boots without it fails fast at startup by design (config/env.ts).
envVarGroups:
  - name: discern-secrets
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: REVENUECAT_WEBHOOK_SECRET
        sync: false
      - key: REVENUECAT_SECRET_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      # Operator secret for GET /v1/ops/jobs. UNSET MEANS THE ENDPOINT IS NOT
      # MOUNTED — absence is a closed door, not an open one. It lived on
      # `requireAuth` until 2026-09-06, which is not a gate here: POST
      # /v1/auth/device mints a token from any device id with no credential, and
      # two job results carry a userId. Generate with: openssl rand -hex 32
      - key: OPS_TOKEN
        sync: false
      # SIGN IN WITH APPLE FAILS CLOSED WITHOUT THIS, and it has never been set.
      #
      # It is the `aud` claim an Apple identity token is verified against.
      # identity-verification.ts refuses to run rather than skip the audience
      # check, because a real Apple token issued to ANY other app would
      # otherwise be accepted as an identity here — so the failure is correct
      # and it is also total: POST /v1/auth/link cannot succeed.
      #
      # Sign-up happens AFTER purchase (onboarding screen 19), so this sits
      # between a paying customer and a working account. Value: com.boltzman.discern
      - key: APPLE_BUNDLE_ID
        sync: false

services:
  - type: web
    name: discern-api
    runtime: node
    plan: starter
    branch: main
    autoDeploy: true
    healthCheckPath: /healthz
    # --include=dev forces devDependencies (TypeScript, @types/*) to install even
    # though NODE_ENV=production, because the build compiles TS. Runtime only
    # needs dist/. Shared builds first: the backend imports @discern/shared.
    buildCommand: npm install --include=dev && npm run build -w @discern/shared && npm run build -w @discern/backend
    startCommand: npm run start -w @discern/backend
    envVars:
      - fromGroup: discern-secrets
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Asserted at boot. Discern shares a cluster with a shipped application, so
      # connecting to `test` or to a neighbour's database must fail loudly rather
      # than quietly serve traffic. See db/connect.ts.
      - key: MONGODB_DB_NAME
        value: discern
      # A REAL AWS region — "auto" is an R2-ism the AWS SDK rejects.
      #
      # AND IT MUST MATCH WHERE THE BUCKET ACTUALLY IS. discern-audio lives in
      # us-east-1. This said us-east-2, and every upload failed with "the bucket
      # you are attempting to access must be addressed using the specified
      # endpoint" — which does not read as a region mismatch until you know.
      - key: AWS_REGION
        value: us-east-1
      - key: S3_BUCKET
        value: discern-audio
      # ── VOICE ───────────────────────────────────────────────────────────
      #
      # SET BY HAND IN THE DASHBOARD UNTIL 2026-09-06 AND NOT IN THIS FILE.
      # That is a live hazard, not a tidiness point: a Blueprint sync would have
      # removed it, and `tts-pregenerate` throws a TERMINAL error when it is
      # false — which is exactly the loop the job was in on 4 September.
      #
      # Both services carry it. The API needs it to offer voice at all; the
      # worker needs it because pregeneration is one of its jobs.
      - key: VOICE_ENABLED
        value: true
      # Her replies are NOT spoken by default. Per-request, never a standing
      # preference: a spoken turn is ~34x the cost of a text one and never
      # caches. This flag only decides whether the app may ask.
      - key: SPEAK_REPLIES
        value: false
      # ── VOICE IDENTITY ──────────────────────────────────────────────────
      #
      # These five are part of the audio CACHE KEY: the hash covers the text,
      # the voice, the model and every setting. Change any of them and all
      # 7,819 cached recordings stop matching and are silently re-synthesized
      # at full price. They are pinned here so a dashboard edit is a diff
      # rather than a surprise bill.
      - key: ELEVENLABS_TTS_MODEL
        value: eleven_turbo_v2_5
      - key: ELEVENLABS_STABILITY
        value: 0.45
      - key: ELEVENLABS_SIMILARITY_BOOST
        value: 0.75
      - key: ELEVENLABS_STYLE
        value: 0.35
      - key: ELEVENLABS_SPEED
        value: 1
      - key: ELEVENLABS_SPEAKER_BOOST
        value: true
      # ABIGAIL'S PROMPTS ARE NOT IN THIS REPOSITORY and the service will not
      # boot without them. Add each as a SECRET FILE in the Render dashboard:
      #
      #   abigail-system.txt
      #   premise-system.txt
      #
      # BARE FILENAMES — the dashboard rejects a "/" in the name, so they land
      # at the project root rather than in a prompts/ subfolder. The loader
      # checks the working directory itself for exactly that reason, so no
      # PROMPTS_DIR is needed here; it exists only for mounting them somewhere
      # else entirely. See discern-backend/src/config/prompts.ts.
      #
      # TEST_CLIENT_ENABLED is DELIBERATELY ABSENT. It gates the throwaway
      # tester page at GET /test, and it is set in the Render dashboard for as
      # long as testing runs, then removed. Declaring it here — at any value —
      # would OVERRIDE the dashboard, so a value in this file could not be
      # turned off without a deploy. It defaults to false in config/env.ts, so
      # absence means off.

  # Same build, different entry point. The worker binds no port and has no health
  # check path, so Render runs it as a background worker rather than a web
  # service.
  #
  # PHASE 1: the entry point is a stub that boots, asserts the database and
  # idles. It is declared now so the manifest matches ARCHITECTURE.md §4 and so
  # the service exists before Phase 8 fills it in.
  - type: worker
    name: discern-worker
    runtime: node
    plan: starter
    branch: main
    autoDeploy: true
    buildCommand: npm install --include=dev && npm run build -w @discern/shared && npm run build -w @discern/backend
    startCommand: npm run start:worker -w @discern/backend
    envVars:
      - fromGroup: discern-secrets
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: MONGODB_DB_NAME
        value: discern
      - key: AWS_REGION
        value: us-east-1
      - key: S3_BUCKET
        value: discern-audio
      # Lower than the API's: the worker is a background poller, and this cluster
      # also serves a production application.
      # ── VOICE ───────────────────────────────────────────────────────────
      #
      # SET BY HAND IN THE DASHBOARD UNTIL 2026-09-06 AND NOT IN THIS FILE.
      # That is a live hazard, not a tidiness point: a Blueprint sync would have
      # removed it, and `tts-pregenerate` throws a TERMINAL error when it is
      # false — which is exactly the loop the job was in on 4 September.
      #
      # Both services carry it. The API needs it to offer voice at all; the
      # worker needs it because pregeneration is one of its jobs.
      - key: VOICE_ENABLED
        value: true
      # Her replies are NOT spoken by default. Per-request, never a standing
      # preference: a spoken turn is ~34x the cost of a text one and never
      # caches. This flag only decides whether the app may ask.
      - key: SPEAK_REPLIES
        value: false
      # ── VOICE IDENTITY ──────────────────────────────────────────────────
      #
      # These five are part of the audio CACHE KEY: the hash covers the text,
      # the voice, the model and every setting. Change any of them and all
      # 7,819 cached recordings stop matching and are silently re-synthesized
      # at full price. They are pinned here so a dashboard edit is a diff
      # rather than a surprise bill.
      - key: ELEVENLABS_TTS_MODEL
        value: eleven_turbo_v2_5
      - key: ELEVENLABS_STABILITY
        value: 0.45
      - key: ELEVENLABS_SIMILARITY_BOOST
        value: 0.75
      - key: ELEVENLABS_STYLE
        value: 0.35
      - key: ELEVENLABS_SPEED
        value: 1
      - key: ELEVENLABS_SPEAKER_BOOST
        value: true
      - key: MONGODB_MAX_POOL_SIZE
        value: 5
      - key: WORKER_CONCURRENCY
        value: 2
